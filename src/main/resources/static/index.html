<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pac-Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <span>PAC-MAN</span>
        <span id="score">0</span>
        <span id="lives">♥♥♥</span>
    </header>
    <div class="stage">
        <canvas id="game" width="672" height="744"></canvas>
        <div id="overlay">
            <div id="message"></div>
            <button id="restart" type="button">Jogar de novo</button>
        </div>
    </div>
    <p class="hint">Setas ou WASD para mover · R reinicia</p>
</div>
<script src="game.js"></script>
</body>
</html>
